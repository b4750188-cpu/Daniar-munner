name: Production Deployment

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Production Build & Cloud Deployment
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

      - name: Build Production Assets
        run: npm run build

      - name: Deploy Verification
        run: |
          echo "Build succeeded. Ready for containerization or Cloud Run deployment."
          test -d dist && echo "dist/ directory verified."
